name: Optimized Health Check

on:
  schedule:
    - cron: '*/20 * * * *'  # A cada 20 minutos (mais econômico)
    #- cron: '*/4 * * * *'  # ⚡ A cada 4 minutos
    #Lembrete importante:
#⚠️ Atenção com o limite do GitHub Actions:

#Contas gratuitas: 2.000 minutos/mês

#Execuções a cada 4 minutos = ~10.800 minutos/mês

#Recomendação: Use intervalos maiores para contas gratuitas

#Para contas gratuitas, recomendo:
#yaml
#on:
  #schedule:
    #- cron: '*/15 * * * *'  # A cada 15 minutos (mais econômico)
    # Ou
    #- cron: '*/30 * * * *'  # A cada 30 minutos (mais econômico ainda)

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache
          key: ${{ runner.os }}-health-check

      - name: Rapid Health Check
        run: |
          echo "🚀 Health Check Rápido - $(date)"
          echo "--------------------------------"
          
          # Testar URLs em paralelo quando possível
          while IFS= read -r url; do
            if [ -n "$url" ]; then
              # Executar em background para ser mais rápido
              (curl -s -f --max-time 10 "$url" > /dev/null && echo "✅ $url" || echo "❌ $url") &
            fi
          done < htps.txt
          
          # Esperar todos os processos terminarem
          wait