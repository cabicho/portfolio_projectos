name: Mozambique SSO Analysis

on:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Tipo de análise'
        required: true  
        default: 'complete'
        type: choice
        options:
        - complete
        - data-collection
        - analysis-only
        - reports-only
  
  schedule:
    - cron: '0 2 * * 1'  # Toda segunda-feira às 2h UTC

env:
  PYTHON_VERSION: '3.9'

jobs:
  mozambique-data-collection:
    name: Collect Mozambique Data
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install plotly statsmodels scikit-learn
        
    - name: Create directories
      run: |
        mkdir -p data/mozambique/{raw,processed,reports}
        
    - name: Run Mozambique data collection
      run: |
        python scripts/mozambique/collect_mozambique_data.py --fonte todos
      
    - name: Upload raw data
      uses: actions/upload-artifact@v4
      with:
        name: mozambique-raw-data
        path: data/mozambique/raw/
        retention-days: 30
        
  mozambique-analysis:
    name: Analyze Mozambique Data
    runs-on: ubuntu-latest
    needs: mozambique-data-collection
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download raw data
      uses: actions/download-artifact@v4
      with:
        name: mozambique-raw-data
        path: data/mozambique/raw/
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install plotly statsmodels scikit-learn
        
    - name: Run Mozambique analysis
      run: |
        python scripts/mozambique/analyze_mozambique_data.py
      
    - name: Upload analysis results
      uses: actions/upload-artifact@v4
      with:
        name: mozambique-analysis-results
        path: |
          data/mozambique/processed/
          data/mozambique/reports/
        retention-days: 90
        
    - name: Create workflow summary
      run: |
        echo "## 🇲🇿 Análise SSO - Moçambique" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Resultados da Análise" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Dados coletados de múltiplas fontes" >> $GITHUB_STEP_SUMMARY  
        echo "- 📈 Análise setorial completa" >> $GITHUB_STEP_SUMMARY
        echo "- 🏢 300 empresas analisadas" >> $GITHUB_STEP_SUMMARY
        echo "- 📋 Dashboards gerados" >> $GITHUB_STEP_SUMMARY
        echo "- 📄 Relatórios disponíveis" >> $GITHUB_STEP_SUMMARY
