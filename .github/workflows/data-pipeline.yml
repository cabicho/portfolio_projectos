name: Mozambique Health Data Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ pipeline_saude_mocambique, pipeline-saude-mocambique-deve]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: pipeline_saude_mocambique
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        cd pipeline-saude-mocambique
        pip install -r requirements.txt
        
    - name: Run Pipeline
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        cd pipeline-saude-mocambique
        python src/main.py
        
    - name: Upload Data
      uses: actions/upload-artifact@v3
      with:
        name: health-data
        path: pipeline-saude-mocambique/data/processed/

  health-check:
    runs-on: ubuntu-latest
    needs: pipeline
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pipeline_saude_mocambique
          
      - name: Run Health Check
        run: |
          chmod +x .github/workflows/health-check.sh
          .github/workflows/health-check.sh
