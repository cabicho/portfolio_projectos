name: 'sst_mozambique'
version: '1.0.0'
config-version: 2

profile: 'sst_mozambique'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  sst_mozambique:
    staging:
      +schema: staging
      +tags: ["staging"]
      ine:
        +materialized: view
      mitess:
        +materialized: view
      ilo:
        +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
      +tags: ["intermediate"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]
