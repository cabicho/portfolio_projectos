# render.yaml
# Configuração otimizada para Neon AWS US East 2 (Ohio)

services:
  - type: web
    name: portfolio-engenharia-api
    env: python
    plan: free
    region: ohio  # Same region as Neon for better performance
    branch: portfolio_engenharia_dados
    rootDir: portfolio-engenharia-dados
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python scripts/init_db.py
    startCommand: python app/main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: NEON_REGION
        value: aws-us-east-2

  # Worker para processamento ETL em background
  - type: worker
    name: etl-processor
    env: python
    plan: free
    region: ohio
    branch: portfolio_engenharia_dados
    rootDir: portfolio-engenharia-dados
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_etl_worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
