# render.yaml CORRIGIDO
services:
  # Serviço Web Principal - Dashboard
  - type: web
    name: credit-control-dashboard
    env: python
    plan: free
    region: ohio  # opções: ohio, virginia, oregon
    branch: pipeline-car-deve
    
    # Build Configuration
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      
    # Start Command
    startCommand: python src/dashboard/app.py
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: ENVIRONMENT
        value: production
      - key: RENDER
        value: true
    
    # Health Check
    healthCheckPath: /
    
    # Auto-Deploy
    autoDeploy: true

# Removido o serviço cron (não tem plano free)
# Para processamento de dados, podemos usar o próprio serviço web
# ou adicionar funcionalidades de background no futuro
