services:
  - type: web
    name: portfolio-engenharia-dados
    env: python
    plan: free
    region: ohio
    repo: https://github.com/cabicho/portfolio_projectos
    branch: pipeline-saude-mocambique
    rootDir: pipeline-saude-mocambique
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python scripts/init_database.py
      python scripts/data_warehouse.py
    startCommand: python app/main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
