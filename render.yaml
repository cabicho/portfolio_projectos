services:
  - type: web
    name: ship-optimization-dashboard
    env: python
    plan: free
    region: ohio
    repo: https://github.com/cabicho/portfolio_projectos
    branch: ship-optimization-accenture
    rootDir: ship-optimization-accenture/ship-optimization-accenture
    buildCommand: |-
      echo "🚀 Starting build process..."
      python --version
      pip --version
      pip install --upgrade pip setuptools wheel
      echo "📦 Installing dependencies..."
      pip install -r requirements.txt
      echo "📊 Generating data..."
      python data/generate_data.py
      echo "🔍 Running analysis..."
      python src/data_analysis.py
      echo "⚡ Running optimization..."
      python src/optimization_model.py
      echo "✅ Build completed successfully!"
    startCommand: gunicorn app.run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /
    autoDeploy: true