services:
  - type: web
    name: mozambique-health-pipeline
    env: python
    plan: free
    region: frankfurt
    repo: https://github.com/cabicho/portfolio_projectos
    branch: pipeline_saude_mocambique
    rootDir: pipeline-saude-mocambique
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn src.api.dashboard:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgresql
          name: your-database-service
          property: connectionString
    autoDeploy: true
