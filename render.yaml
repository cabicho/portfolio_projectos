
# render.yaml - Corrigido para estrutura real
# render.yaml - Atualizado para plano free
# Arquivo principal: app.py


services:
  - type: web
    name: portfolio-engenharia-api
    env: python
    plan: free
    region: ohio
    branch: portfolio_engenharia_dados
    rootDir: portfolio-engenharia-dados
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python scripts/init_db.py
    startCommand: python app/main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
