services:
  - type: web
    name: regulatory-data-api
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: regulatory-db
          property: connectionString

databases:
  - name: regulatory-db
    plan: free
    databaseName: regulatory_db
    user: admin
